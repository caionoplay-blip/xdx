<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="XĐX Mercado - Escaneie etiquetas, controle sua lista e economize. Instale no celular e use como app." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XĐX Mercado" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="XĐX" />
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#10b981" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light only !important;
      }
      html, body { 
        background-color: #ffffff !important; 
        background: #ffffff !important;
        background-image: linear-gradient(#ffffff, #ffffff) !important;
        background-repeat: no-repeat !important;
        background-size: cover !important;
        color: #1a202c !important; 
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        color-scheme: light !important;
        forced-color-adjust: none !important;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        background-color: #ffffff !important;
        background-image: linear-gradient(#ffffff, #ffffff) !important;
        min-height: 100vh;
      }
    </style>
    <title>XĐX Mercado - Scanner Inteligente</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #ffffff; color: #1a202c; font-family: sans-serif; text-align: center; padding: 20px;">
        <h2 style="margin-bottom: 10px; color: #1a202c;">Mercado Scan</h2>
        <p style="color: #4a5568;">Carregando aplicativo...</p>
      </div>
    </div>
    <script>
      // Global error handler for mobile debugging
      window.onerror = function(msg, url, line, col, error) {
        var errorInfo = msg + ' (' + url + ':' + line + ':' + col + ')';
        console.error("Global Error:", errorInfo);
        
        // Se o app falhar ao carregar, mostra o erro visível
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (root.innerText.includes('Carregando') || root.innerText === '')) {
            root.innerHTML = '<div style="padding:20px; text-align:center; font-family:sans-serif; background:white; min-height:100vh;">' +
              '<h2 style="color:#e53e3e; margin-top:40px;">Erro ao Iniciar</h2>' +
              '<p style="color:#4a5568; font-size:14px;">Ocorreu um erro técnico ao carregar o aplicativo.</p>' +
              '<div style="background:#f7fafc; padding:15px; border-radius:10px; margin:20px 0; font-family:monospace; font-size:12px; text-align:left; overflow-wrap:break-word; border:1px solid #edf2f7; color:#2d3748;">' +
                '<strong>DEBUG INFO:</strong><br>' + errorInfo + 
                (error && error.stack ? '<br><br><strong>STACK:</strong><br>' + error.stack.substring(0, 300) : '') +
              '</div>' +
              '<button onclick="location.reload()" style="background:#10b981; color:white; border:none; padding:12px 24px; border-radius:25px; font-weight:bold; width:100%; max-width:200px; box-shadow:0 4px 6px rgba(16,185,129,0.2);">Tentar Novamente</button>' +
              '<p style="margin-top:20px; font-size:11px; color:#a0aec0;">Dica: Verifique se o Android System WebView está atualizado.</p>' +
              '</div>';
          }
        }, 3000);
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
